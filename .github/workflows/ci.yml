name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check single-file app exists and is non-empty
        run: |
          test -s public/index.html || (echo "public/index.html is missing or empty" && exit 1)
          echo "public/index.html OK ($(wc -c < public/index.html) bytes)"
